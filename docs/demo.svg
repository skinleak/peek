  <text x="32.6" y="262" fill="#9CA3AF" xml:space="preserve">node /home/dev/code/webapp/node_modules/.bin/next dev · user dev</text>
  <text x="32.6" y="284" xml:space="preserve"><tspan fill="#FBBF24" font-weight="700">Send SIGTERM to node (PID 48213) on port 3000?</tspan><tspan fill="#9CA3AF"> [y/N]</tspan></text>
