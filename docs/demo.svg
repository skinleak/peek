<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-labelledby="title desc">
  <title id="title">peek in a terminal</title>
  <desc id="desc">Running peek lists listening ports with process, PID, address, working directory and uptime; peek kill 3000 stops the process on port 3000.</desc>
  <rect width="720" height="378" rx="10" fill="#1A1B26"/>
  <rect width="720" height="36" rx="10" fill="#24263A"/>
  <rect y="26" width="720" height="10" fill="#24263A"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="6" fill="#28C840"/>
  <text x="360.0" y="23" fill="#9CA3AF" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">peek</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14">
  <text x="24.0" y="64" fill="#7DD3FC" font-weight="700">$</text>
  <text x="41.2" y="64" fill="#E5E7EB" font-weight="700">peek</text>
  <text x="58.4" y="86" fill="#9CA3AF" font-weight="700" text-anchor="end">PORT</text>
  <text x="75.6" y="86" fill="#9CA3AF" font-weight="700">PROCESS</text>
  <text x="256.2" y="86" fill="#9CA3AF" font-weight="700" text-anchor="end">PID</text>
  <text x="273.4" y="86" fill="#9CA3AF" font-weight="700">ADDRESS</text>
  <text x="368.0" y="86" fill="#9CA3AF" font-weight="700">CWD</text>
  <text x="557.2" y="86" fill="#9CA3AF" font-weight="700">UPTIME</text>
  <text x="58.4" y="108" fill="#A78BFA" font-weight="700" text-anchor="end">3000</text>
  <text x="75.6" y="108" fill="#E5E7EB">node</text>
  <text x="256.2" y="108" fill="#E5E7EB" text-anchor="end">48213</text>
  <text x="273.4" y="108" fill="#4ADE80">127.0.0.1</text>
  <text x="368.0" y="108" fill="#E5E7EB">~/code/webapp</text>
  <text x="557.2" y="108" fill="#9CA3AF">2h14m</text>
  <text x="58.4" y="130" fill="#A78BFA" font-weight="700" text-anchor="end">5173</text>
  <text x="75.6" y="130" fill="#E5E7EB">node</text>
  <text x="256.2" y="130" fill="#E5E7EB" text-anchor="end">48377</text>
  <text x="273.4" y="130" fill="#4ADE80">::1</text>
  <text x="368.0" y="130" fill="#E5E7EB">~/code/webapp/client</text>
  <text x="557.2" y="130" fill="#9CA3AF">2h13m</text>
  <text x="58.4" y="152" fill="#A78BFA" font-weight="700" text-anchor="end">5432</text>
  <text x="75.6" y="152" fill="#E5E7EB">docker-proxy</text>
  <text x="256.2" y="152" fill="#E5E7EB" text-anchor="end">1931</text>
  <text x="273.4" y="152" fill="#FBBF24">0.0.0.0</text>
  <text x="368.0" y="152" fill="#E5E7EB">/</text>
  <text x="557.2" y="152" fill="#9CA3AF">3d4h</text>
  <text x="58.4" y="174" fill="#A78BFA" font-weight="700" text-anchor="end">6379</text>
  <text x="75.6" y="174" fill="#E5E7EB">redis-server</text>
  <text x="256.2" y="174" fill="#E5E7EB" text-anchor="end">1187</text>
  <text x="273.4" y="174" fill="#4ADE80">127.0.0.1</text>
  <text x="368.0" y="174" fill="#E5E7EB">/var/lib/redis</text>
  <text x="557.2" y="174" fill="#9CA3AF">3d4h</text>
  <text x="58.4" y="196" fill="#A78BFA" font-weight="700" text-anchor="end">8000</text>
  <text x="75.6" y="196" fill="#E5E7EB">python3</text>
  <text x="256.2" y="196" fill="#E5E7EB" text-anchor="end">51002</text>
  <text x="273.4" y="196" fill="#FBBF24">0.0.0.0</text>
  <text x="368.0" y="196" fill="#E5E7EB">~/code/api</text>
  <text x="557.2" y="196" fill="#9CA3AF">12m</text>
  <text x="24.0" y="240" fill="#7DD3FC" font-weight="700">$</text>
  <text x="41.2" y="240" fill="#E5E7EB" font-weight="700">peek kill 3000</text>
  <text x="24.0" y="262" fill="#E5E7EB">Send SIGTERM to node (PID 48213) on port 3000? [y/N] y</text>
  <text x="24.0" y="284" fill="#E5E7EB">Stopped node (PID 48213) on port 3000</text>
  <text x="24.0" y="328" fill="#7DD3FC" font-weight="700">$</text>
  <text x="41.2" y="328" fill="#E5E7EB" font-weight="700">peek 3000</text>
  <text x="24.0" y="350" fill="#E5E7EB">Nothing is listening on port 3000</text>
  </g>
</svg>
