<svg xmlns="http://www.w3.org/2000/svg" width="736" height="306" viewBox="0 0 736 306" role="img" aria-labelledby="title desc">
  <title id="title">peek -i in a terminal</title>
  <desc id="desc">The interactive view of peek lists listening ports with process, PID, address, working directory and uptime. Interpreters show their script, such as node (vite), a newly opened port is marked with a plus, and the selected node process on port 3000 is waiting for confirmation before it is sent SIGTERM.</desc>
  <rect width="736" height="306" rx="10" fill="#1A1B26"/>
  <rect width="736" height="36" rx="10" fill="#24263A"/>
  <rect y="26" width="736" height="10" fill="#24263A"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="6" fill="#28C840"/>
  <text x="368.0" y="23" fill="#9CA3AF" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">peek -i</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14">
  <text x="32.6" y="64" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">peek</tspan><tspan fill="#9CA3AF">  5 listening</tspan></text>
  <text x="75.6" y="108" fill="#9CA3AF" font-weight="700" text-anchor="end" xml:space="preserve">PORT</text>
