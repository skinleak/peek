  <text x="462.6" y="108" fill="#9CA3AF" font-weight="700" xml:space="preserve">CWD</text>
  <text x="651.8" y="108" fill="#9CA3AF" font-weight="700" xml:space="preserve">UPTIME</text>
  <rect x="39.2" y="115" width="666.2" height="20" rx="3" fill="#374151"/>
  <text x="24.0" y="130" fill="#A78BFA" font-weight="700" xml:space="preserve">›</text>
  <text x="75.6" y="130" fill="#A78BFA" font-weight="700" text-anchor="end" xml:space="preserve">3000</text>
