name: Feature request
description: Suggest an idea for peek
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: For example the command you'd run and the output you'd expect.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
